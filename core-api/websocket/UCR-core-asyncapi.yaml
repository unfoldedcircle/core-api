            msg_data:
              type: object
              properties:
                mode:
                  $ref: '#/components/schemas/PowerMode'
                battery:
                  $ref: '#/components/schemas/BatteryStatusResponse'
                power_supply:
                  description: A power supply is online, device doesn't enter standby while connected.
                  type: boolean
                standby_timeout_sec:
                  description: |
                    Time in seconds until the system goes into standby.
                    This is the max value of the regular standby and the longest active standby inhibitor.
                  type: integer
                  minimum: 0
                standby_inhibitors:
                  description: |
                    There are active standby inhibitors preventing system standby.
                    - A blocking inhibitor will return a constant `standby_timeout_sec` value of `86400` (1 day).
                  type: boolean
              required:
                - mode
                - power_supply
