      allOf:
        - $ref: '#/components/schemas/CommonReq'
        - properties:
            msg:
              type: string
              const: set_api_access
            msg_data:
              properties:
                web_configurator:
                  type: object
                  properties:
                    enabled:
                      description: Enable or disable access for the web-configurator.
                      type: boolean
                    pin:
                      description: Set a new access pin.
                      type: string
                      minLength: 4
                    valid_to:
                      description: |
                        Optional timestamp when the access automatically expires. If not set the access is allowed until
                        the account is disabled.
                      type: string
                      format: date-time
                  required:
                    - enabled
              required:
                - web_configurator
          required:
            - msg
            - msg_data
    GetApiAccessMsg:
      type: object
