        auto_brightness:
          description: When enabled, button backlight will automatically turn on in a dark room.
          type: boolean
    cmd_id:
      description: |
        Entity command identifier, as returned in the entity command metadata.

        This identifier may change at any time and may not be used for logic decisions in a client!
        If entity specific information is required, the entity object must be loaded from the `entity_id`.

        ### Stopping an activity or macro sequence

        `activity.stop` and `macro.stop` abort a sequence that is still running, whether it is an
        on-sequence, an off-sequence or a macro. The remaining steps are not executed and are not
        resumed later; commands already sent to a device are **not** reversed. Once the sequence
        has been aborted, the entity reports the `STOPPED` state.

        Stopping is idempotent: if no sequence is running for the entity, the request still
        succeeds and nothing is reported. This keeps a stop that races the natural end of a
        sequence from failing.

        The request is answered once the stopped sequence has fully wound down, so that a
        follow-up command cannot overlap with it at a shared device. Aborting a step that is
        already in flight can therefore delay the response by a few seconds.
      type: string
    SequenceErrorPolicy:
      description: |
        How entity command failures are handled while an activity or macro sequence runs.

        The policy applies per step class. *Transition steps* are the power-off commands of the activity an activity
        group is switching away from: they are prepended to the incoming activity's sequence and therefore run under
        the incoming activity's command, even though they belong to the outgoing one.

        - `abort`: any failing command aborts the sequence, transition steps included.
        - `continue_transition` (**default**): a failing transition step is continued past, so an unreachable device of
          the activity being switched away from does not prevent the new activity from starting. The failure is still
          reported: the outgoing activity ends in state `ERROR`, not `OFF`, because its devices may still be on. A
          failing step of the activity's own sequence aborts it, as without a group switch.
        - `ignore_all`: no failing command aborts the sequence and none is reported — the run reaches its normal final
          state and the outgoing activity of a group switch is reported `OFF` even if its power-off failed. Use this to
          force a start past known-unreachable devices. A missing entity is skipped as well.
      type: string
      default: continue_transition
      enum:
        - abort
        - continue_transition
        - ignore_all
    params:
      description: |
        Optional command parameters as key / value pairs. See entity documentation for available parameters.

        The parameters listed below are only interpreted by the activity and macro sequence commands
        (`activity.on`, `activity.off`, `activity.start`, `macro.run`) and are ignored by every other entity.

        They do **not** apply to `activity.stop` and `macro.stop`: those abort a running sequence
        instead of executing one, and take no parameters.
      type: object
      properties:
        error_policy:
          $ref: '#/components/schemas/SequenceErrorPolicy'
      additionalProperties: true
    RemoveTurnOnDelays:
      description: |
        - `previous_cmd_skipped`: Only remove delay steps if the previous step is skipped, because the entity is in a
           power-on state.
        - `between_skipped_cmds`: Only remove delay steps if the previous and next power-on steps are skipped, because
           the entity is already in a power-on state.
        - `never`: Never remove delay steps in the on-sequence of the new activity.
      type: string
      enum:
        - previous_cmd_skipped
        - between_skipped_cmds
        - never
    TurnOffUnusedEntities:
      description: |
        - `always`: Always turn off unused entities in the previous activity.  
           All included entities are considered, not just the ones used in the on-sequence of the new activity.
        - `in_off_sequence`: Only turn off unused entities which are included in the off-sequence of the previous activity.
        - `run_off_sequence`: Run the original off-sequence of the old activity and dynamically filter out power-off commands.  
           All power-off commands from entities used in the new activity's power-on sequence will be filtered out.
        - `never`: Never turn off entities in the previous activity.
      type: string
      enum:
        - always
        - in_off_sequence
        - run_off_sequence
        - never
    WifiSecurity:
      description: |
        WiFi network security type:
        - `OPEN`: open network without authentication
        - `WPA_PSK`: WPA / WPA2 Personal with a pre-shared key
        - `WPA3_SAE`: WPA3 Personal (SAE) only. Requires WPA3 support of the device's WiFi hardware,
          otherwise the request is rejected.
        - `WPA2_WPA3`: WPA2 / WPA3 transition mode. Falls back to WPA2-PSK on devices without
          WPA3 hardware support.

        When omitted in a create-network request, a password creates the strongest profile the
        device's WiFi hardware supports (`WPA2_WPA3` with WPA3 support, `WPA_PSK` otherwise);
        without a password an open network is created.

        In scan results the field is omitted if the network security could not be classified
        (e.g. WEP or EAP-only networks).
      type: string
      enum:
        - OPEN
        - WPA_PSK
        - WPA3_SAE
        - WPA2_WPA3
    BtSecurityType:
      description: |
        Bonding security type:
        - `JustWorks`: Automatic pairing, peripheral only needs to confirm pairing request from central.
        - `DisplayNumber`: Peripheral must display number for the central to confirm.
        - `NumericComparison`: Peripheral must confirm or declined if the numeric value matches the displayed number on the central.
        - `PasskeyInput`: Peripheral must enter displayed passkey on central.
      type: string
      enum:
        - JUST_WORKS
        - DISPLAY_NUMBER
        - NUMERIC_COMPARISON
        - PASSKEY_INPUT
    IntegrationDiscovery:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/DriverId'
        configured:
          description: |
            Integration configuration flag:
            - true: driver has already been configured
            - false: driver has not yet been configured
          type: boolean
        name:
          type: string
        developer_name:
          type: string
        icon:
          $ref: '#/components/schemas/IconIdentifier'
        driver_url:
          description: Resolved driver url.
          type: string
        pwd_protected:
          description: Driver requires a connection password.
          type: boolean
        version:
          description: Detected driver version.
          type: string
        timestamp:
          description: Timestamp of integration discovery.
          type: string
          format: date-time
      required:
        - id
        - configured
        - name
        - driver_url
    DockDiscovery-2:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/DockId'
        configured:
          description: |
            Dock configuration flag for this remote:
            - true: device has already been configured
            - false: device has not yet been configured
          type: boolean
        friendly_name:
          $ref: '#/components/schemas/DockName'
        address:
          description: Resolved device network address.
          type: string
        model:
          description: Detected dock model.
          type: string
        version:
          description: Detected firmware version.
          type: string
        discovery_type:
          $ref: '#/components/schemas/DiscoveryType'
        timestamp:
          description: Timestamp of dock discovery.
          type: string
          format: date-time
        bt:
          type: object
          description: Optional Bluetooth discovery information. Not present for network device.
          properties:
            signal:
              description: Bluetooth signal strength. 0 = min, 5 = max.
              type: integer
              minimum: 0
              maximum: 5
            last_seen_sec:
              description: |
                Last time the device was seen on a Bluetooth scan. Values over 15 sec indicate that the device is no longer
                reachable.
              type: integer
              format: int32
      required:
        - id
        - configured
        - discovery_type
