        - time_format_24h
        - measurement_unit
    MeasurementUnit:
      type: string
      enum:
        - METRIC
        - US
        - UK
    CfgNetwork:
      description: |
        `wake_on_wlan` is deprecated, please use `wifi.wake_on_wlan`
      type: object
      properties:
        bt_enabled:
          description: Enable Bluetooth.
          type: boolean
        wifi_enabled:
          description: Enable WiFi.
          type: boolean
        wake_on_wlan:
          $ref: '#/components/schemas/CfgNetworkWoWlan'
        wifi:
          $ref: '#/components/schemas/CfgNetworkWifi'
        bt:
          description: Temporary read-only Bluetooth information until dedicated BT management endpoint is provided.
          type: object
          properties:
            address:
              description: Bluetooth MAC address
              type: string
        ws:
          $ref: '#/components/schemas/CfgNetworkWs'
      required:
        - bt_enabled
        - wifi_enabled
    CfgNetworkUpdate:
      description: |
        `wake_on_wlan` is deprecated, please use `wifi.wake_on_wlan`
      type: object
      properties:
        bt_enabled:
          description: Enable Bluetooth.
          type: boolean
        wifi_enabled:
          description: Enable WiFi.
          type: boolean
        wake_on_wlan:
          $ref: '#/components/schemas/CfgNetworkWoWlan'
        wifi:
          $ref: '#/components/schemas/CfgNetworkWifiUpdate'
        ws:
          $ref: '#/components/schemas/CfgNetworkWs'
    CfgNetworkWs:
      description: |
        Optional expert settings for WebSocket (re-)connection handling.  
        These settings are only intended for support issues and might change any time. Changed values are not supported
        and might make the system unstable!
      type: object
      properties:
        dock:
          type: object
        integration:
          type: object
