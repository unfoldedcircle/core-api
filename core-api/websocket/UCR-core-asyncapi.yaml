          $ref: '#/components/schemas/CfgNetworkWoWlan'
        bands:
          description: Available WiFi bands
          type: array
          items:
            $ref: '#/components/schemas/WifiBand'
        band:
          $ref: '#/components/schemas/WifiBand'
        scan_interval_sec:
          $ref: '#/components/schemas/WifiScanInterval'
        ipv4_type:
          $ref: '#/components/schemas/CfgIpv4Type'
        ipv4:
          $ref: '#/components/schemas/CfgIpv4'
      required:
        - bands
        - band
    CfgNetworkWifiUpdate:
      type: object
      properties:
        wake_on_wlan:
          $ref: '#/components/schemas/CfgNetworkWoWlan'
        band:
          $ref: '#/components/schemas/WifiBand'
        scan_interval_sec:
          $ref: '#/components/schemas/WifiScanInterval'
    WifiScanInterval:
      description: |
        Active WiFi scan interval in seconds. A value of 0 disables active scanning. Minimal interval is 10 seconds.
      minimum: 0
      type: integer
    CfgIpv4Type:
      type: string
      enum:
        - DHCP
    CfgIpv4:
      type: object
    CfgPowerSaving:
      type: object
      properties:
        wakeup_sensitivity:
          description: Amount of movement needed to wake up the remote. 0 = disabled, 1 = min, 2 = medium, 3 = max.
          type: integer
          minimum: 0
          maximum: 3
        display_off_sec:
          type: integer
          minimum: 0
          maximum: 60
          description: Turn off display after given seconds.
        standby_sec:
          type: integer
          minimum: 0
          maximum: 10800
          description: Activate standby after given seconds. 0 disables standby mode.
      required:
        - wakeup_sensitivity
        - display_off_sec
        - standby_sec
    CfgProfile:
      type: object
      properties:
        has_admin_pin:
          description: An administrator pin has been set to use restricted profiles.
          type: boolean
      required:
        - has_admin_pin
    CfgProfileUpdate:
      type: object
      properties:
        admin_pin:
          $ref: '#/components/schemas/AdminPin'
    CfgSoftwareUpdate:
      type: object
      properties:
        check_for_updates:
          description: |
            Automatically check for updates. If `auto_update` is enabled, the updates are automatically installed,
            otherwise the user is only notified about the updates.

            The time window when to check for new updates can be specified in `ota_window_start` and `ota_window_end`.
            Update checks are performed daily.
          type: boolean
        auto_update:
          description: |
            Automatically update the remote when new software is available. Requires `check_for_updates` to be enabled.

            Auto-installation of new firmwares will usually happen over 2 update checks: the first check finds a new
            update, downloads the metadata and schedules the firmware file to be downloaded. The next check will find the
            downloaded firmware file and installs it.
          type: boolean
        ota_window_start:
          description: |
            OTA update window start time: automatic update checks will only be performed during this time window.  
            Furthermore, the remote needs to be in the docking station and have enough battery charge.

            Format: time of day - as defined by `partial-time` in RFC3339
          type: string
          pattern: ^(0[0-9]|1[0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$
        ota_window_end:
          description: |
            OTA update window end time.

            - If the end time is before the start time, the window will spawn over midnight, e.g. `23:00:00` - `01:00:00`.
            - Both start and end times are required, otherwise a default will be used.
          type: string
          pattern: ^(0[0-9]|1[0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$
        channel:
          description: |
            Software update channels:
            - `DEFAULT`: release channel
            - `TESTING`: new test and beta versions which might become the next release if successfully tested.
            - `DEVELOPMENT`: untested alpha versions from the developers.  
               ⚠️ High chance of breaking changes, bugs and loosing data!

            Other channels than `DEFAULT` might require an access token in `channel_token`, since they are intended for
            a closed user group.
          type: string
          anyOf:
            - enum:
                - DEFAULT
                - TESTING
                - DEVELOPMENT
            - {}
        channel_token:
          description: |
            Optional access token which might be required for non-default software update channels.
            - This token is write only and cannot be retrieved anymore.
            - If omitted when updating settings: the stored token will be used.
            - If the `default` channel is selected when updating settings: the token will be ignored.
          type: string
          pattern: ^[-a-zA-Z0-9._~+/]{1,256}=?$
        restart_required:
          description: 'Optional response field only: a configuration change requires a restart.'
          type: boolean
      required:
        - check_for_updates
        - auto_update
    CfgSound:
      type: object
      properties:
        enabled:
          description: Sound effects enabled.
          type: boolean
        volume:
          description: Sound effects volume.
          type: integer
          minimum: 0
          maximum: 100
      required:
        - enabled
        - volume
    CfgVoiceControl:
      description: |
        Voice control settings with enriched voice assistant configuration.
        No voice assistant is enabled if the `voice_assistant.active` object is missing.
      type: object
      properties:
        microphone:
          description: |
            Enable microphone. Disabling the microphone will completely turn it off. Voice control and dictation won't work
            with the remote or integrations.
          type: boolean
        voice_assistant:
          $ref: '#/components/schemas/CfgVoiceAssistant'
      required:
        - microphone
        - voice_assistant
    CfgVoiceAssistant:
      description: |
        The main voice assistant to use for voice control, if no other voice assistant is configured for a specific
        screen, for example, in an activity.
      type: object
      properties:
        active:
          $ref: '#/components/schemas/VoiceAssistant'
        profile_id:
          $ref: '#/components/schemas/SimpleId'
        speech_response:
          description: Enable speech response if supported by the voice assistant. Disabled by default.
          type: boolean
          default: false
    CfgVoiceControlUpdate:
      description: |
        Update object for voice control settings. A missing field will keep the old value.
      type: object
      properties:
        microphone:
          description: |
            Enable microphone. Disabling the microphone will completely turn it off. Voice control and dictation won't work
            with the remote or integrations.
          type: boolean
        voice_assistant:
          $ref: '#/components/schemas/CfgVoiceAssistantUpdate'
    CfgVoiceAssistantUpdate:
      description: |
        The main voice assistant to use for voice control, if no other voice assistant is configured for a specific
        screen, for example, in an activity.
      type: object
      properties:
        entity_id:
          description: Voice assistant entity id to use, empty for removing a configured voice assistant.
          type: string
        profile_id:
          $ref: '#/components/schemas/SimpleId'
        speech_response:
          description: Enable speech response if supported by the voice assistant. Disabled by default.
          type: boolean
      required:
        - entity_id
    VoiceAssistants:
      type: array
      items:
        $ref: '#/components/schemas/VoiceAssistant'
    VoiceAssistant:
      description: |
        Voice assistant definition.

        This is a tailored representation of the voice_assistant entity, which can be used to display voice assistant
        information to users.

        - `profiles` specify optional parameters that can be used by starting a voice command.
        - `features` are the default features supported by the voice assistant.  
           If multiple profiles are supported, this should be the feature list of the preferred profile.
        - `preferred_profile` is the preferred profile specified by the integration.  
           The user can select another default profile in the voice assistant settings.
      type: object
      properties:
        entity_id:
          $ref: '#/components/schemas/EntityId'
        name:
          $ref: '#/components/schemas/LanguageText'
        icon:
          $ref: '#/components/schemas/IconIdentifier'
        state:
          type: string
        features:
          $ref: '#/components/schemas/VoiceAssistantFeatures'
        profiles:
          $ref: '#/components/schemas/VoiceAssistantProfiles'
        preferred_profile:
          $ref: '#/components/schemas/SimpleId'
      required:
        - entity_id
        - name
    VoiceAssistantFeatures:
      type: array
      items:
        $ref: '#/components/schemas/VoiceAssistantFeature'
    VoiceAssistantFeature:
      description: |
        Supported voice assistant or profile features.
        - transcription: Supports voice command transcription.
        - response_text: Supports textual response about the performed action.
        - response_speech: Supports speech response about the performed action.
      type: string
      enum:
        - transcription
        - response_text
        - response_speech
    VoiceAssistantProfiles:
      type: array
      items:
        $ref: '#/components/schemas/VoiceAssistantProfile'
    VoiceAssistantProfile:
      description: |
        Profiles are optional and allow parameterizing voice input. A regular voice-capable device usually just accepts voice
        input without additional parameters. Home automation systems can offer multi-language support or an option to use
        local or cloud processing.

        For example, Home Assistant allows configuring multiple Assist pipelines for voice commands.
        These pipelines can offer different languages or speech recognition engines.

        - `language` is an optional language code if the profile represents a specific language for speech recognition.
        - `features` is optional and overwrites the voice assistant features, for example, if a profile has less or more features.
        - An empty `features` array means "no features".
      type: object
      properties:
        id:
          $ref: '#/components/schemas/SimpleId'
        name:
          description: Friendly name to show in UI.
          type: string
          minLength: 1
          maxLength: 50
        language:
          $ref: '#/components/schemas/LanguageCode'
        features:
          $ref: '#/components/schemas/VoiceAssistantFeatures'
      required:
        - id
        - name
    AssistantEvent:
      type: object
      properties:
        type:
          type: string
          enum:
            - ready
            - stt_response
            - text_response
            - speech_response
            - finished
            - error
        entity_id:
          type: string
        session_id:
          type: integer
          minimum: 0
        data:
          type: object
      required:
        - type
        - entity_id
        - session_id
      discriminator: type
      oneOf:
        - title: Ready
          properties:
            type:
              const: ready
        - title: SttResponse
          properties:
            type:
              const: stt_response
            data:
              $ref: '#/components/schemas/AssistantSttResponse'
          required:
            - data
        - title: TextResponse
          properties:
            type:
              const: text_response
            data:
              $ref: '#/components/schemas/AssistantTextResponse'
          required:
            - data
        - title: SpeechResponse
          properties:
            type:
              const: speech_response
            data:
              $ref: '#/components/schemas/AssistantSpeechResponse'
          required:
            - data
        - title: Finished
          properties:
            type:
              const: finished
        - title: Error
          properties:
            type:
              const: error
            data:
              $ref: '#/components/schemas/AssistantError'
          required:
            - data
    AssistantSttResponse:
      type: object
      properties:
        text:
          type: string
      required:
        - text
    AssistantTextResponse:
      type: object
      properties:
        success:
          type: boolean
        text:
          type: string
      required:
        - success
        - text
    AssistantSpeechResponse:
      type: object
      properties:
        url:
          type: string
          format: url
        mime_type:
          type: string
      required:
        - url
        - mime_type
    AssistantError:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/AssistantErrorCode'
        message:
          type: string
      required:
        - code
        - message
    AssistantErrorCode:
      type: string
      enum:
        - SERVICE_UNAVAILABLE
        - INVALID_AUDIO
        - NO_TEXT_RECOGNIZED
        - INTENT_FAILED
        - TTS_FAILED
        - TIMEOUT
        - UNEXPECTED_ERROR
    IntegrationStatus:
      type: object
      description: |
        Integration instance status information. Intended to be used in a general overview of the integration drivers.
      properties:
        integration_id:
          $ref: '#/components/schemas/IntegrationId'
        name:
          $ref: '#/components/schemas/LanguageText'
        icon:
          $ref: '#/components/schemas/IconIdentifier'
        device_state:
          $ref: '#/components/schemas/DeviceState'
        driver_state:
          $ref: '#/components/schemas/DriverState'
        state:
          $ref: '#/components/schemas/IntegrationState'
        enabled:
          type: boolean
    DeviceState:
      type: string
      enum:
        - UNKNOWN
        - CONNECTING
        - CONNECTED
        - DISCONNECTED
        - ERROR
    DriverState:
      type: string
      enum:
        - NOT_CONFIGURED
        - IDLE
        - CONNECTING
        - ACTIVE
        - RECONNECTING
        - ERROR
    IntegrationState:
      type: string
      enum:
        - NOT_CONFIGURED
        - UNKNOWN
        - IDLE
        - CONNECTING
        - CONNECTED
        - DISCONNECTED
        - RECONNECTING
        - ACTIVE
        - ERROR
    IntegrationDriverType:
      type: string
      description: |
        - `LOCAL`: pre-installed integration driver in the firmware.
        - `CUSTOM`: user-installed custom integration driver on the remote.
        - `EXTERNAL`: external integration driver on the network.
      enum:
        - LOCAL
        - CUSTOM
        - EXTERNAL
    IntegrationDriverInfo:
      type: object
      description: |
        Summary data of an integration driver intended for overview screens.
      properties:
        driver_id:
          $ref: '#/components/schemas/DriverId'
        name:
          $ref: '#/components/schemas/LanguageText'
        developer_name:
          type: string
        driver_type:
          $ref: '#/components/schemas/IntegrationDriverType'
        driver_url:
          description: WebSocket URL of external driver
          type: string
          format: uri
          maxLength: 255
        version:
          type: string
        icon:
          $ref: '#/components/schemas/IconIdentifier'
        enabled:
          type: boolean
        driver_state:
          $ref: '#/components/schemas/DriverState'
      required:
        - driver_id
        - name
        - driver_type
        - version
        - enabled
    IntegrationDriver:
      type: object
      description: |
        Integration driver model.

        A driver represents the communication aspect of an integration. E.g. how one can connect to it
        and which API version it supports.

        One driver can provide multiple `Integration` instances. In the integration API they are
        referred to as `multi-device integrations` and use the optional `device_id` property where
        required. If a driver only provides a single instance, which is usually the default use case,
        then the `device_id` is not used (or set to the default value `main`).
      properties:
        driver_id:
          $ref: '#/components/schemas/DriverId'
        name:
          $ref: '#/components/schemas/LanguageText'
        driver_type:
          $ref: '#/components/schemas/IntegrationDriverType'
        driver_url:
          description: WebSocket URL of the driver. Only optional for integration driver metadata.
          type: string
          format: uri
          maxLength: 2048
        token:
          description: |
            Optional driver authentication token.

            Note: the token will not be returned to external clients!
          type: string
          maxLength: 2048
        auth_method:
          $ref: '#/components/schemas/IntgAuthMethod'
        pwd_protected:
          description: Driver requires a connection password.
          type: boolean
        version:
          description: Driver version, [SemVer](https://semver.org/) preferred.
          type: string
          maxLength: 20
        min_core_api:
          description: |
            Optional version check: minimum required core API version in the remote.
          type: string
          maxLength: 20
        icon:
          $ref: '#/components/schemas/IconIdentifier'
        enabled:
          description: |
            Enables or disables driver communication. For development use only!  
            If disabled, all integration instances won't be activated, even if the instance is enabled.
          type: boolean
        description:
          $ref: '#/components/schemas/LanguageText'
        developer:
          $ref: '#/components/schemas/DriverDeveloper'
        home_page:
          description: Optional home page url for more information.
          type: string
          format: uri
          maxLength: 255
        device_discovery:
          description: Driver supports multi-device discovery. **Not yet supported**.
          type: boolean
        setup_data_schema:
          $ref: '#/components/schemas/SettingsPage'
        release_date:
          description: Release date of the driver.
          type: string
          format: date
        driver_state:
          $ref: '#/components/schemas/DriverState'
      required:
        - driver_id
        - name
        - version
    DriverDeveloper:
      type: object
      description: Optional information about the integration developer.
      properties:
        name:
          description: Optional developer information to display in UI / web-configurator.
          type: string
          maxLength: 100
        url:
          description: Optional developer home page.
          type: string
          format: uri
          maxLength: 255
        email:
          description: Optional developer contact email.
          type: string
          format: email
          maxLength: 100
    IntegrationDriverUpdate:
      type: object
      description: |
        Integration driver update model. This model corresponds to the `IntegrationDriver` model except there are no required
        properties to allow patch updates. 

        - Specified properties will update the current values.
        - An empty value will delete the currently set property.
        - For the create operation, the `driver_id` identifier can be specified by the client, but it needs to be unique among
          all drivers. If omitted, a UUID will be assigned.  
          A manually assigned, short, human-readable identifier is recommended for better recognizability.
      properties:
        driver_id:
          $ref: '#/components/schemas/DriverId'
        name:
          $ref: '#/components/schemas/LanguageText'
        driver_url:
          description: WebSocket URL of the driver
          type: string
          format: uri
          maxLength: 2048
        token:
          description: |
            Optional driver authentication token.

            Note: the token will not be returned to external clients!
          type: string
          maxLength: 2048
        auth_method:
          $ref: '#/components/schemas/IntgAuthMethod'
        version:
          description: Driver version, [SemVer](https://semver.org/) preferred.
          type: string
          maxLength: 20
        min_core_api:
          description: |
            Optional version check: minimum required Core-API version in the remote.
          type: string
          maxLength: 20
        icon:
          $ref: '#/components/schemas/IconIdentifier'
        enabled:
          description: |
            Enables or disables driver communication.  
            If disabled, all integration instances won't be activated, even if the instance is enabled.
          type: boolean
        description:
          $ref: '#/components/schemas/LanguageText'
        developer:
          $ref: '#/components/schemas/DriverDeveloper'
        home_page:
          description: Optional home page url for more information.
          type: string
          format: uri
          maxLength: 255
        device_discovery:
          description: Driver supports multi-device discovery. **Not yet supported**.
          type: boolean
        setup_data_schema:
          description: |
            Driver configuration metadata describing configuration parameters for the web-configurator.

            **TODO Not yet finalized**.
          type: object
        release_date:
          description: Release date of the driver.
          type: string
          format: date
      required:
        - driver_id
    Integration:
      type: object
      description: |
        Integration instance model.
      properties:
        integration_id:
          $ref: '#/components/schemas/IntegrationId'
        driver_id:
          $ref: '#/components/schemas/DriverId'
        device_id:
          $ref: '#/components/schemas/DeviceId'
        name:
          $ref: '#/components/schemas/LanguageText'
        icon:
          $ref: '#/components/schemas/IconIdentifier'
        enabled:
          description: Enable / disable flag. For development use only!
          type: boolean
        setup_data:
          description: Instance configuration object
          type: object
        device_state:
          $ref: '#/components/schemas/DeviceState'
      required:
        - integration_id
        - driver_id
        - name
        - enabled
    IntegrationUpdate:
      type: object
      description: |
        Integration instance update model. This model corresponds to the `Integration` model except there are no required
        properties to allow patch updates. 

        - Specified properties will update the current values.
        - An empty value will delete a set property.
        - `device_id` is only required for multi-device integrations.
      properties:
        integration_id:
          $ref: '#/components/schemas/IntegrationId'
        driver_id:
          $ref: '#/components/schemas/DriverId'
        device_id:
          $ref: '#/components/schemas/DeviceId'
        name:
          $ref: '#/components/schemas/LanguageText'
        icon:
          $ref: '#/components/schemas/IconIdentifier'
        enabled:
          description: Enable / disable flag. For development use only!
          type: boolean
        setup_data:
          description: Instance configuration object.
          type: object
      required:
        - integration_id
    IntegrationDiscoveryStatus:
      type: object
      properties:
        active:
          description: |
            Integration discovery still active or not.
          type: boolean
        integrations:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationDiscovery'
      required:
        - active
        - integrations
    CreateIntegrationSetup:
      type: object
      properties:
        driver_id:
          $ref: '#/components/schemas/DriverId'
        name:
          $ref: '#/components/schemas/LanguageText'
        setup_data:
          $ref: '#/components/schemas/SettingsValues'
        reconfigure:
          description: Reconfigure an already configured integration.
          type: boolean
      required:
        - driver_id
    IntegrationSetupInfo:
      type: object
      description: Integration setup state
      properties:
        id:
          type: string
        state:
          $ref: '#/components/schemas/IntegrationSetupState'
        error:
          $ref: '#/components/schemas/IntegrationSetupError'
        require_user_action:
          description: If set, the setup process waits for the specified user action.
          oneOf:
            - type: object
              properties:
                input:
                  $ref: '#/components/schemas/SettingsPage'
              required:
                - input
            - type: object
              properties:
                confirmation:
                  $ref: '#/components/schemas/ConfirmationPage'
              required:
                - confirmation
      required:
        - id
        - state
    EntityChange:
      type: object
      description: |
        The `new_state` property is omitted for `event_type` = `delete`.  
        The client should reload all entity data, if only `event_type` is present.
      properties:
        event_type:
          $ref: '#/components/schemas/DefaultChangeEventType'
        entity_id:
          $ref: '#/components/schemas/EntityId'
        entity_type:
          $ref: '#/components/schemas/EntityType'
        new_state:
          $ref: '#/components/schemas/EntityUpdate'
      required:
        - event_type
    ActivityGroupChange:
      type: object
      description: |
        The `new_state` property is omitted for `event_type` = `delete`.  
        The client should reload all activity group data, if only `event_type` is present.
      properties:
        event_type:
          $ref: '#/components/schemas/DefaultChangeEventType'
        group_id:
          $ref: '#/components/schemas/EntityId'
        new_state:
          $ref: '#/components/schemas/ActivityGroup'
      required:
        - event_type
    ActiveProfileChange:
      type: object
      description: |
        The `new_state.profile` object contains additional profile data of the new active `profile_id`.
      properties:
        profile_id:
          $ref: '#/components/schemas/SimpleId'
        new_state:
          type: object
          properties:
            profile:
              $ref: '#/components/schemas/ProfileData'
      required:
        - profile_id
    ProfileChange:
      type: object
      description: |
        The `new_state` property is omitted for `event_type` = `delete`.
      properties:
        event_type:
          $ref: '#/components/schemas/DefaultChangeEventType'
        profile_id:
          $ref: '#/components/schemas/SimpleId'
        page_id:
          $ref: '#/components/schemas/SimpleId'
        group_id:
          $ref: '#/components/schemas/SimpleId'
        new_state:
          type: object
          properties:
            profile:
              $ref: '#/components/schemas/ProfileData'
            page:
              $ref: '#/components/schemas/PageData'
            group:
              $ref: '#/components/schemas/GroupData'
      required:
        - event_type
        - profile_id
    IntegrationDriverChange:
      type: object
      description: |
        The `new_state` property is omitted for `event_type` = `delete`.
      properties:
        event_type:
          $ref: '#/components/schemas/DefaultChangeEventType'
        driver_id:
          $ref: '#/components/schemas/DriverId'
        new_state:
          $ref: '#/components/schemas/IntegrationDriverUpdate'
      required:
        - event_type
        - driver_id
    IntegrationChange:
      type: object
      description: |
        The `new_state` property is omitted for `event_type` = `delete`.
      properties:
        event_type:
          $ref: '#/components/schemas/DefaultChangeEventType'
        integration_id:
          $ref: '#/components/schemas/IntegrationId'
        new_state:
          $ref: '#/components/schemas/IntegrationUpdate'
      required:
        - event_type
        - integration_id
    IntegrationStateData:
      type: object
      properties:
        driver_id:
          $ref: '#/components/schemas/DriverId'
        device_state:
          $ref: '#/components/schemas/DeviceState'
        driver_state:
          $ref: '#/components/schemas/DriverState'
      required:
        - driver_id
    DefaultChangeEventType:
      type: string
      enum:
        - CHANGE
        - NEW
        - DELETE
    ConfigurationChange:
      type: object
      properties:
        new_state:
          $ref: '#/components/schemas/CfgAll'
      required:
        - new_state
    IrLearning:
      type: object
      properties:
        device_id:
          description: IR emitter device identifier.
          type: string
        event_type:
          type: string
          enum:
            - START
            - STOP
            - CODE
        code:
          $ref: '#/components/schemas/IrLearningCode'
      required:
        - device_id
        - event_type
    IrLearningCode:
      type: object
      properties:
        format:
          description: IR format of learned IR code data.
          type: string
          enum:
            - HEX
            - PRONTO
        value:
          description: Learned IR code data.
          type: string
      required:
        - format
        - value
    DockId:
      type: string
      format: ^[a-zA-Z0-9\-\.]+$
      minLength: 1
      maxLength: 64
      description: Dock identifier
    DockName:
      type: string
      minLength: 1
      maxLength: 40
      description: User assignable friendly name to use instead of dock_id (service name).
    DockUrl:
      type: string
      maxLength: 64
      description: Dock WebSocket URL to override auto-discovery from the service name in `dock_id`.
    DockToken:
      type: string
      format: password
      minLength: 1
      maxLength: 40
      description: Access token
    DockFilter:
      description: Optional filters
      type: object
      properties:
        active:
          type: boolean
    DockChangeData:
      type: object
      description: |
        The `new_state` property is omitted for `event_type` = `delete`.
      properties:
        event_type:
          $ref: '#/components/schemas/DefaultChangeEventType'
        dock_id:
          $ref: '#/components/schemas/EntityId'
        new_state:
          $ref: '#/components/schemas/DockConfiguration'
      required:
        - event_type
        - dock_id
    DockConfiguration:
      type: object
      properties:
        dock_id:
          $ref: '#/components/schemas/DockId'
        name:
          $ref: '#/components/schemas/DockName'
        custom_ws_url:
          $ref: '#/components/schemas/DockUrl'
        resolved_ws_url:
          type: string
          maxLength: 64
          description: Resolved WebSocket URL from the service name in `dock_id` if no `custom_ws_url` is used.
        active:
          type: boolean
          description: |
            Enable flag: active docks are automatically connected when network is available.
        model:
          type: string
          description: Dock model number.
        revision:
          type: string
          description: Dock revision.
        serial:
          type: string
          description: Dock serial number.
        led_brightness:
          type: integer
          minimum: 0
          maximum: 100
        eth_led_brightness:
          type: integer
          minimum: 0
          maximum: 100
        connection_type:
          type: string
          description: |
            Network connection of the dock: `Ethernet` or `WiFi`.
        version:
          type: string
          description: Firmware version
        state:
          $ref: '#/components/schemas/DockState'
        learning_active:
          type: boolean
          description: Dock is in IR learning mode.
        port_count:
          type: integer
          minimum: 0
        ports:
          description: 3️⃣ External port mode configuration.
          type: array
          items:
            $ref: '#/components/schemas/ExternalPortConfiguration'
        volume:
          description: 3️⃣ Speaker volume.
          type: integer
          minimum: 0
          maximum: 100
        description:
          $ref: '#/components/schemas/Description'
      required:
        - dock_id
        - active
    DockConfigurationRequest:
      type: object
      properties:
        dock_id:
          $ref: '#/components/schemas/DockId'
        name:
          $ref: '#/components/schemas/DockName'
        custom_ws_url:
          $ref: '#/components/schemas/DockUrl'
        token:
          $ref: '#/components/schemas/DockToken'
        active:
          type: boolean
          description: |
            Enable flag: active docks are automatically connected when network is available.
        model:
          type: string
          description: Dock model number.
        description:
          $ref: '#/components/schemas/Description'
      required:
        - dock_id
        - active
    DockUpdateRequest:
      type: object
      properties:
        dock_id:
          $ref: '#/components/schemas/DockId'
        name:
          type: string
          maxLength: 40
          description: User assignable friendly name to use instead of dock_id (service name).
        custom_ws_url:
          $ref: '#/components/schemas/DockUrl'
        token:
          type: string
          maxLength: 40
          description: Access token to connect to the dock.
        change_dock_token:
          type: boolean
          default: true
          description: |
            Change access token in the dock or only in the remote.

            - If set to true, the token is also changed in the Dock.  
              This requires an active Dock connection, otherwise error 503 is returned.
            - If set to false, the token is only changed in the Remote.  
              The new token is used in the next connection attempt.
        active:
          type: boolean
          description: Auto connect to dock when network is available.
        description:
          type: string
          description: Optional description.
        wifi:
          type: object
          properties:
            ssid:
              description: Network name (service set identifier)
              type: string
              maxLength: 32
            password:
              type: string
              maxLength: 63
      required:
        - dock_id
    DockSystemInfo:
      type: object
      properties:
        name:
          type: string
        hostname:
          type: string
        model:
          type: string
        revision:
          type: string
        version:
          type: string
        serial:
          type: string
        ir_learning:
          type: boolean
        ethernet:
          type: boolean
        wifi:
          type: boolean
        ssid:
          description: Network name (Service Set IDentifier)
          type: string
    DockStateData:
      type: object
      properties:
        dock_id:
          type: string
        state:
          $ref: '#/components/schemas/DockState'
      required:
        - dock_id
        - state
    DockState:
      type: string
      description: Dock connection state
      enum:
        - IDLE
        - CONNECTING
        - ACTIVE
        - RECONNECTING
        - ERROR
    DockPortMode:
      type: object
      properties:
        dock_id:
          type: string
        port:
          $ref: '#/components/schemas/ExternalPortConfiguration'
      required:
        - dock_id
        - port
    DockDiscovery:
      type: object
      properties:
        event_type:
          type: string
          enum:
            - START
            - STOP
            - DISCOVER
        dock:
          $ref: '#/components/schemas/DockDiscovery-2'
      required:
        - event_type
    DockDiscoveryInformation:
      $ref: '#/components/schemas/DockDiscovery-2'
    DiscoveryType:
      type: string
      description: |
        Device discovery type:
        - `BT`: Bluetooth
        - `NET`: LAN or WAN network
      enum:
        - BT
        - NET
    CreateDockSetup:
      type: object
      oneOf:
        - type: object
          properties:
            discovery:
              $ref: '#/components/schemas/DockSetupFromDiscovery'
          required:
            - discovery
        - type: object
          properties:
            manually:
              $ref: '#/components/schemas/DockSetup'
          required:
            - manually
    DockSetup:
      type: object
      description: Dock setup data
      properties:
        dock_id:
          $ref: '#/components/schemas/DockId'
        name:
          $ref: '#/components/schemas/DockName'
        token:
          $ref: '#/components/schemas/DockToken'
        custom_ws_url:
          $ref: '#/components/schemas/DockUrl'
        description:
          $ref: '#/components/schemas/Description'
        wifi:
          description: |
            Optional WiFi information if the dock should connect to (or be prepared for) WiFi instead of Ethernet.
          type: object
          properties:
            ssid:
              description: Network name (service set identifier)
              type: string
            password:
              type: string
              format: password
          required:
            - ssid
            - password
      required:
        - name
    DockSetupFromDiscovery:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/DockId'
        friendly_name:
          $ref: '#/components/schemas/DockName'
        address:
          description: Resolved device network address.
          type: string
        model:
          description: Detected dock model.
          type: string
        version:
          description: Detected firmware version.
          type: string
        discovery_type:
          $ref: '#/components/schemas/DiscoveryType'
      required:
        - id
        - discovery_type
    DockSetupInfo:
      type: object
      description: Dock setup state
      properties:
        id:
          type: string
        name:
          $ref: '#/components/schemas/DockName'
        model:
          type: string
          description: Dock model number.
        discovery_type:
          $ref: '#/components/schemas/DiscoveryType'
        state:
          $ref: '#/components/schemas/DockSetupState'
        error:
          $ref: '#/components/schemas/DockSetupError'
      required:
        - id
        - state
    DockSetupChange:
      type: object
      properties:
        event_type:
          type: string
          enum:
            - START
            - SETUP
            - STOP
        dock_id:
          type: string
        state:
          $ref: '#/components/schemas/DockSetupState'
        error:
          $ref: '#/components/schemas/DockSetupError'
      required:
        - event_type
        - dock_id
        - state
    DockSetupState:
      type: string
      enum:
        - NEW
        - CONFIGURING
        - UPLOADING
        - RESTARTING
        - OK
        - ERROR
    DockSetupError:
      type: string
      enum:
        - NONE
        - NOT_FOUND
        - CONNECTION_ERROR
        - CONNECTION_REFUSED
        - AUTHORIZATION_ERROR
        - TIMEOUT
        - ABORT
        - PERSISTENCE_ERROR
        - OTHER
    DockUpdateChange:
      type: object
      properties:
        event_type:
          type: string
          enum:
            - START
            - UPDATE
            - STOP
        dock_id:
          type: string
        update_id:
          description: Update identifier
          type: string
        version:
          description: Firmware version being installed
          type: string
        progress:
          description: Update progress in percent
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        state:
          $ref: '#/components/schemas/DockSetupState'
        error:
          $ref: '#/components/schemas/DockSetupError'
      required:
        - event_type
        - dock_id
        - state
    AvailableSystemUpdateResponse:
      type: object
      properties:
        update_in_progress:
          type: boolean
        last_check_date:
          description: Last update check timestamp.
          type: string
          format: date-time
        next_check_date:
          description: Next scheduled update check timestamp.
          type: string
          format: date-time
        update_check_enabled:
          type: boolean
        installed_version:
          description: Installed system version.
          type: string
        available:
          type: array
          items:
            $ref: '#/components/schemas/AvailableSystemUpdate'
      required:
        - update_check_enabled
        - installed_version
        - available
    AvailableSystemUpdate:
      type: object
      properties:
        id:
          description: Update identifier
          type: string
        title:
          type: string
        description:
          $ref: '#/components/schemas/LanguageText'
        version:
          type: string
        channel:
          $ref: '#/components/schemas/UpdateChannel'
        release_date:
          type: string
          format: date
        size:
          type: integer
          format: int64
        release_notes_url:
          type: string
          format: uri
        download:
          $ref: '#/components/schemas/UpdateDownloadState'
      required:
        - id
        - title
        - description
        - version
        - release_date
        - size
    UpdateChannel:
      type: string
      enum:
        - STABLE
        - TESTING
        - DEVELOPMENT
    UpdateDownloadState:
      description: |
        Download status:
        - `PENDING`: update is scheduled to download
        - `DOWNLOADING`: update is currently downloading
        - `DOWNLOADED`: update has been downloaded and is ready to be installed
        - `ERROR`: download failed
      type: string
      enum:
        - PENDING
        - DOWNLOADING
        - DOWNLOADED
        - ERROR
    SystemUpdateResponse:
      type: object
      properties:
        state:
          $ref: '#/components/schemas/SystemUpdateState'
        update_id:
          description: Update identifier
          type: string
      required:
        - state
        - update_id
    SoftwareUpdateEvent:
      type: object
      properties:
        event_type:
          type: string
          enum:
            - START
            - PROGRESS
            - STOP
        update_id:
          description: Update identifier
          type: string
        progress:
          $ref: '#/components/schemas/SystemUpdateProgress'
      required:
        - event_type
        - update_id
    PowerModeChangeEvent:
      type: object
      properties:
        mode:
          $ref: '#/components/schemas/PowerMode'
      required:
        - mode
    BatteryStatus:
      $ref: '#/components/schemas/BatteryStatusResponse'
    SystemUpdateProgress:
      type: object
      properties:
        state:
          $ref: '#/components/schemas/SystemUpdateState'
        update_id:
          description: Update identifier
          type: string
        download_percent:
          description: Percent of download
          type: integer
        download_bytes:
          description: Total of bytes to be downloaded
          type: integer
          format: int64
        total_steps:
          description: Total number of update steps
          type: integer
        current_step:
          description: Current installation step index
          type: integer
        current_percent:
          description: Percent in current step
          type: integer
      required:
        - state
        - update_id
    SystemUpdateState:
      type: string
      enum:
        - IDLE
        - START
        - RUN
        - SUCCESS
        - FAILURE
        - DOWNLOAD
        - DONE
        - SUB_PROCESS
        - PROGRESS
    IntegrationDiscoveryEvent:
      type: object
      properties:
        event_type:
          type: string
          enum:
            - START
            - STOP
            - DISCOVER
        integration:
          $ref: '#/components/schemas/IntegrationDiscovery'
      required:
        - event_type
    IntegrationDiscoveryInformation:
      $ref: '#/components/schemas/IntegrationDiscovery'
    IntegrationSetupChange:
      type: object
      properties:
        event_type:
          description: |
            - `START`: setup started
            - `SETUP`: setup in progress. See `state` enum for current setup state.
            - `STOP`: setup finished, either with: `state: OK` for successful setup, or `state: ERROR` if setup 
                      didn't completed successfully.
          type: string
          enum:
            - START
            - SETUP
            - STOP
        driver_id:
          type: string
        state:
          $ref: '#/components/schemas/IntegrationSetupState'
        error:
          $ref: '#/components/schemas/IntegrationSetupError'
        require_user_action:
          description: If set, the setup process waits for the specified user action.
          type: object
          oneOf:
            - type: object
              properties:
                input:
                  type: object
                  $ref: '#/components/schemas/SettingsPage'
              required:
                - input
            - type: object
              properties:
                confirmation:
                  type: object
                  $ref: '#/components/schemas/ConfirmationPage'
              required:
                - confirmation
      required:
        - event_type
        - driver_id
        - state
    IntegrationSetupState:
      type: string
      enum:
        - SETUP
        - WAIT_USER_ACTION
        - OK
        - ERROR
    IntegrationSetupError:
      type: string
      enum:
        - NONE
        - NOT_FOUND
        - CONNECTION_REFUSED
        - AUTHORIZATION_ERROR
        - TIMEOUT
        - OTHER
    ConfirmationPage:
      description: |
        Confirmation screen.
        - `message1`: Message to display between title and image (if supplied). Supports Markdown formatting.
        - `message2`: Message to display below message1 or image (if supplied). Supports Markdown formatting.
      type: object
      properties:
        title:
          $ref: '#/components/schemas/LanguageText'
        message1:
          $ref: '#/components/schemas/LanguageText'
        image:
          description: |
            Optional base64-encoded image.

            TODO maximum encoded length to avoid WebSocket continuation frames, supported image formats
            (png & svg?), max height & width
          type: string
          format: byte
          maxLength: 32768
        message2:
          $ref: '#/components/schemas/LanguageText'
      required:
        - title
    SettingsPage:
      description: Settings definition page, e.g. to configure an integration driver.
      type: object
      properties:
        title:
          $ref: '#/components/schemas/LanguageText'
        settings:
          description: One or multiple input field definitions, with optional pre-set values.
          type: array
          items:
            $ref: '#/components/schemas/Setting'
      required:
        - title
        - settings
    Setting:
      description: |
        An input setting is of a specific type defined in `field.type` which defines how it is presented to the user.

        Inspired by the [Homey SDK settings](https://apps.developer.homey.app/the-basics/devices/settings) concept.
      type: object
      properties:
        id:
          description: Unique identifier of the setting to be returned with the entered value.
          type: string
          maxLength: 50
        label:
          $ref: '#/components/schemas/LanguageText'
        field:
          oneOf:
            - $ref: '#/components/schemas/SettingTypeNumber'
            - $ref: '#/components/schemas/SettingTypeText'
            - $ref: '#/components/schemas/SettingTypeTextArea'
            - $ref: '#/components/schemas/SettingTypePassword'
            - $ref: '#/components/schemas/SettingTypeCheckbox'
            - $ref: '#/components/schemas/SettingTypeDropdown'
            - $ref: '#/components/schemas/SettingTypeLabel'
      required:
        - id
        - label
        - field
    SettingTypeNumber:
      description: |
        Number input with optional `min`, `max`, `steps` and `decimals` properties. The default value must be specified
        in `value`. An optional unit of the number setting can be specified in `unit`, which will be displayed next to
        the input field.
      type: object
      properties:
        number:
          type: object
          properties:
            value:
              description: Default value for input field.
              type: number
            min:
              description: 'Optional validation: minimum allowed value (inclusive).'
              type: number
            max:
              description: 'Optional validation: maximum allowed value (inclusive).'
              type: number
            steps:
              description: |
                Optional validation: allowed step increment between values. Might also be used in the UI for input helpers.
              type: number
            decimals:
              description: Number of decimal places. 0 = integer value
              type: integer
              minimum: 0
              default: 0
            unit:
              $ref: '#/components/schemas/LanguageText'
          required:
            - value
      required:
        - number
    SettingTypeText:
      description: |
        Single line of text input.

        TODO: format specifier for e.g. email, url, date, datetime etc.?
      type: object
      properties:
        text:
          type: object
          properties:
            value:
              description: Optional default value.
              type: string
            regex:
              description: Optional regex validation pattern for the input value.
              type: string
      required:
        - text
    SettingTypeTextArea:
      description: Multi-line text input, e.g. for providing a description.
      type: object
      properties:
        textarea:
          type: object
          properties:
            value:
              description: Optional default value.
              type: string
      required:
        - textarea
    SettingTypePassword:
      description: |
        Password or pin entry field with the input text hidden from the user. Otherwise the same as text input.
      type: object
      properties:
        password:
          type: object
          properties:
            value:
              description: Optional default value.
              type: string
              format: password
            regex:
              description: Optional regex validation pattern for the input value.
              type: string
      required:
        - password
    SettingTypeCheckbox:
      description: Checkbox setting with `true` / `false` values.
      type: object
      properties:
        checkbox:
          type: object
          properties:
            value:
              description: Initial setting.
              type: boolean
          required:
            - value
      required:
        - checkbox
    SettingTypeDropdown:
      description: Dropdown setting to pick a single value from a list. All values must be strings.
      type: object
      properties:
        dropdown:
          type: object
          properties:
            value:
              description: Pre-selected dropdown id
              type: string
            items:
              type: array
              items:
                type: object
                properties:
                  id:
                    description: Selection identifier.
                    type: string
                  label:
                    $ref: '#/components/schemas/LanguageText'
                required:
                  - id
                  - label
          required:
            - items
      required:
        - dropdown
    SettingTypeLabel:
      description: |
        Additional read-only text for information purpose between other settings. Supports Markdown formatting.
      type: object
      properties:
        label:
          type: object
          properties:
            value:
              $ref: '#/components/schemas/LanguageText'
          required:
            - value
      required:
        - label
    SettingsValues:
      description: |
        User input result of a SettingsPage as key values.
        - key: id of the field
        - value: entered user value as string. This is either the entered text or number, selected checkbox state or the
          selected dropdown item id.  
          ⚠️ Non native string values as numbers or booleans are represented as string values!
      type: object
      additionalProperties:
        type: string
    Description:
      type: string
      maxLength: 255
      description: Optional description
    Groups:
      type: array
      items:
        $ref: '#/components/schemas/Group'
    Group:
      type: object
      description: |
        The shown group switch in the UI is automatically determined by the capabilities of the group's entities.
      properties:
        group_id:
          $ref: '#/components/schemas/SimpleId'
        profile_id:
          $ref: '#/components/schemas/SimpleId'
        name:
          $ref: '#/components/schemas/Name'
        icon:
          $ref: '#/components/schemas/IconIdentifier'
        entities:
          type: array
          description: Entity identifiers belonging to the group
          items:
            $ref: '#/components/schemas/EntityId'
        description:
          $ref: '#/components/schemas/Description'
      required:
        - group_id
        - profile_id
        - name
        - entities
    GroupData:
      type: object
      properties:
        group_id:
          $ref: '#/components/schemas/SimpleId'
        profile_id:
          $ref: '#/components/schemas/SimpleId'
        name:
          $ref: '#/components/schemas/Name'
          description: Group name
        icon:
          $ref: '#/components/schemas/IconIdentifier'
        entities:
          type: array
          description: |
            Changed or re-ordered group entities.
            An empty array remove all entities.
            If the property is not specified the defined entities will not be changed.
          items:
            $ref: '#/components/schemas/SimpleId'
        description:
          $ref: '#/components/schemas/Description'
    IconIdentifier:
      type: string
      format: ^[a-z][a-z0-9]+:[a-zA-Z0-9\-_\.]+$
      maxLength: 255
      description: |
        Optional icon identifier. The identifier consists of a prefix and a resource identifier, separated by `:`.  
        Available prefixes:
        - `uc:` - integrated icon font 
        - `custom:` - custom icon resource
        - `ctv:` - custom TV icon resource

        Other prefixes might be rejected by the service.

        An empty identifier, while updating the object, removes the existing icon.
    ImageIdentifier:
      type: string
      format: ^[a-z][a-z0-9]+:[a-zA-Z0-9\-_\.]+$
      maxLength: 255
      description: |
        Optional image identifier. The identifier consists of a prefix and a resource identifier, separated by `:`.  
        Available prefixes:
        - `custom:` - custom image resource

        Other prefixes might be rejected by the service.

        An empty identifier, while updating the object, removes the existing image.
    Name:
      type: string
      minLength: 1
      maxLength: 50
    Pages:
      type: array
      items:
        $ref: '#/components/schemas/Page'
    Page:
      type: object
      properties:
        page_id:
          $ref: '#/components/schemas/SimpleId'
        profile_id:
          $ref: '#/components/schemas/SimpleId'
        name:
          $ref: '#/components/schemas/Name'
        image:
          type: string
          description: Optional image identifier
        items:
          type: array
          description: Page items
          items:
            $ref: '#/components/schemas/PageItem'
        pos:
          type: integer
          format: int32
          minimum: 0
          description: Position of the page within the profile
      required:
        - page_id
        - profile_id
        - name
        - items
        - pos
    PageItem:
      type: object
      properties:
        entity_id:
          $ref: '#/components/schemas/EntityId'
        group_id:
          $ref: '#/components/schemas/SimpleId'
        pos:
          type: integer
          format: int32
          minimum: 0
          description: |
            Position of the item within the page. Returned on retrieval, ignored for page updates where the position is taken
            from the page array position.
      oneOf:
        - required:
            - entity_id
        - required:
            - group_id
    PageData:
      description: Profile page data to create or update an existing page.
      type: object
      properties:
        page_id:
          $ref: '#/components/schemas/SimpleId'
        profile_id:
          $ref: '#/components/schemas/SimpleId'
        name:
          $ref: '#/components/schemas/Name'
          description: Page name
        image:
          $ref: '#/components/schemas/ImageIdentifier'
        items:
          type: array
          description: |
            Changed or re-ordered page items.
            - An empty array removes all items.
            - If the property is not specified the defined items will not be changed.
          items:
            $ref: '#/components/schemas/PageItem'
      required:
        - page_id
        - profile_id
        - name
    Profiles:
      type: array
      items:
        $ref: '#/components/schemas/Profile'
    Profile:
      type: object
      properties:
        profile_id:
          $ref: '#/components/schemas/SimpleId'
        name:
          $ref: '#/components/schemas/Name'
        icon:
          $ref: '#/components/schemas/IconIdentifier'
        restricted:
          description: A restricted profile cannot change settings and switching profiles requires the admin PIN.
          type: boolean
        description:
          $ref: '#/components/schemas/Description'
      required:
        - profile_id
        - name
        - restricted
    ProfileData:
      description: |
        Profile data to create or modify a profile. Missing properties are not updated when modifying an existing profile.
      type: object
      properties:
        profile_id:
          $ref: '#/components/schemas/SimpleId'
        name:
          $ref: '#/components/schemas/Name'
        icon:
          $ref: '#/components/schemas/IconIdentifier'
        restricted:
          description: A restricted profile cannot change settings. Switching profiles requires the admin pin.
          type: boolean
        description:
          $ref: '#/components/schemas/Description'
        pages:
          description: |
            Used for update only: modify page order or delete pages in profile.
            - An empty `pages` array will delete all pages and containing groups!
            - If the property is missing, the existing page configuration will not be changed.
          type: array
          items:
            $ref: '#/components/schemas/SimpleId'
      required:
        - profile_id
    AdminPin:
      type: string
      maxLength: 20
      description: Optional administrator pin
    SimpleId:
      type: string
      format: ^[a-zA-Z0-9\-_\.]+$
      minLength: 1
      maxLength: 36
      description: Simple string identifier, also usable as URL parameter or file identifier
    DriverId:
      type: string
      format: ^[a-zA-Z0-9\-_]+$
      minLength: 1
      maxLength: 36
      description: Unique integration driver identifier, e.g. `homeassistant`, `homey`, etc.
    IntegrationId:
      type: string
      format: ^[a-zA-Z0-9\-_\.]+$
      minLength: 1
      maxLength: 73
      description: |
        Unique integration instance identifier. Automatically created by the system when creating a new instance from a driver.
    DeviceId:
      type: string
      format: ^[a-zA-Z0-9\-_]+$
      minLength: 1
      maxLength: 36
      description: Device identifier for multi-device integrations only.
    EntityId:
      type: string
      format: ^[a-zA-Z0-9\-_\.]+$
      minLength: 5
      maxLength: 110
      description: Unique UC Remote identifier over all entities and integrations.
    IntgAuthMethod:
      type: string
      description: |
        Integration driver authentication method if a token is required.

        The JSON `auth` message is used if a token is configured but no authentication method is set.
      enum:
        - HEADER
        - MESSAGE
    ApScanStatus:
      type: object
      properties:
        active:
          type: boolean
        scan:
          type: array
          items:
            $ref: '#/components/schemas/AccessPointScan'
      required:
        - active
        - scan
    AccessPointScan:
      type: object
      properties:
        bssid:
          description: MAC physical address of the access point (basic service set identifier)
          type: string
        frequency:
          description: Frequency of the channel in MHz (e.g., 2412 = channel 1)
          type: string
        signal_level:
          description: Signal level (dBm)
          type: integer
        auth:
          description: Authentication method
          type: string
        security:
          $ref: '#/components/schemas/WifiSecurity'
        ssid:
          description: |
            SSID network name as friendly UTF-8 representation. Use this name to present the network to users, but not for
            adding a new network configuration. This is a lossy conversion from the native SSID byte array.
          type: string
        ssid_hex:
          description: |
            Hex encoded string of the native SSID byte array.

            Always use this representation, when connecting to a network from a scan result.
          type: string
      required:
        - bssid
        - ssid
        - ssid_hex
    WifiStatus:
      type: object
      properties:
        bands:
          description: Available WiFi bands
          type: array
          items:
            $ref: '#/components/schemas/WifiBand'
        wpa_state:
          $ref: '#/components/schemas/WpaState'
        id:
          description: Network identifier
          type: integer
        bssid:
          description: MAC physical address of the access point (basic service set identifier)
          type: string
        ssid:
          description: Network name (service set identifier)
          type: string
        ssid_hex:
          description: Hex encoded string of the native SSID byte array.
          type: string
        freq:
          description: Frequency of the channel in MHz (e.g., 2412 = channel 1)
          type: integer
        address:
          description: MAC physical address of the WiFi adapter
          type: string
        pairwise_cipher:
          type: string
        group_cipher:
          type: string
        key_mgmt:
          type: string
        ip_address:
          description: Client IP address
          type: string
        noise:
          description: Noise level (dBm)
          type: integer
        rssi:
          description: Signal level (dBm)
          type: integer
        avg_rssi:
          description: Average RSSI (dBm)
          type: integer
        est_throughput:
          description: Estimated throughput in kbps
          type: integer
        snr:
          description: Signal-to-noise ratio in dB
          type: integer
        linkspeed:
          description: Link speed (Mbps)
          type: integer
      required:
        - wpa_state
    WifiBand:
      description: |
        WiFi band:
        - `auto`: auto-configuration
        - `a`: 5 GHz
        - `b`: 2.4 GHz
      type: string
      enum:
        - auto
        - a
        - b
    CreateWifiNetwork:
      type: object
      properties:
        ssid:
          description: |
            Network name (service set identifier).

            Only use for valid UTF-8 names, when creating a new configuration and not from a scan result.    
            Always use `ssid_hex`, when adding a network configuration from a scan result! Otherwise it's not guaranteed,
            that the correct network is configured. The SSID name can contain non-displayable characters.
          type: string
          minLength: 1
          maxLength: 32
        ssid_hex:
          description: |
            Hex encoded string of the native SSID byte array, returned from a network scan.
          minLength: 2
          maxLength: 64
        password:
          type: string
          minLength: 8
          maxLength: 63
        security:
          $ref: '#/components/schemas/WifiSecurity'
        hidden:
          description: |
            Hidden network: actively probe for the SSID to connect to a non-broadcasting access point.
          type: boolean
    ModifyWifiNetwork:
      type: object
      properties:
        id:
          type: integer
          minimum: 0
        password:
          type: string
          minLength: 1
          maxLength: 63
      required:
        - id
        - password
    SavedNetworks:
      type: array
      items:
        $ref: '#/components/schemas/SavedNetwork'
    SavedNetwork:
      description: A saved network configuration (known network)
      type: object
      properties:
        id:
          description: Network identification, used for further operations on this network
          type: integer
        ssid:
          description: Network name (service set identifier)
          type: string
        ssid_hex:
          description: Hex encoded string of the native SSID byte array.
          type: string
        secured:
          description: Secured or unsecured network
          type: boolean
        security:
          $ref: '#/components/schemas/WifiSecurity'
        signal_level:
          type: integer
        state:
          $ref: '#/components/schemas/NetworkState'
      required:
        - id
        - ssid
        - ssid_hex
        - secured
    WpaState:
      description: |
        - `UNKNOWN`: Unknown state. The driver returned a state which could not be handled.
        - `ERROR`: Error retrieving state information.
        - `DISCONNECTED`: This state indicates that client is not associated, but is likely to start looking for an access point. This state is entered when a connection is lost.
        - `INTERFACE_DISABLED`: This state is entered if the network interface is disabled. The driver refuses any new operations that would use the radio until the interface has been enabled.
        - `INACTIVE`: This state is entered if there are no enabled networks in the configuration. The driver is not trying to associate with a new network and external interaction (e.g. add or enable a network) is needed to start association.
        - `SCANNING`: Scanning for a network.
        - `AUTHENTICATED`: Trying to authenticate with a BSS/SSID.
        - `ASSOCIATING`: Trying to associate with a BSS/SSID.
        - `ASSOCIATED`: Association completed.
        - `FOUR_WAY_HANDSHAKE`: WPA 4-Way Key Handshake in progress.
        - `GROUP_HANDSHAKE`: WPA Group Key Handshake in progress.
        - `COMPLETED`: All authentication completed.
      type: string
      enum:
        - UNKNOWN
        - ERROR
        - DISCONNECTED
        - INTERFACE_DISABLED
        - INACTIVE
        - SCANNING
        - AUTHENTICATED
        - ASSOCIATING
        - ASSOCIATED
        - FOUR_WAY_HANDSHAKE
        - GROUP_HANDSHAKE
        - COMPLETED
    WifiCmd:
      type: string
      enum:
        - DISCONNECT
        - RECONNECT
        - REASSOCIATE
        - ENABLE_ALL_NETWORKS
        - DISABLE_ALL_NETWORKS
    WifiNetworkCmd:
      type: string
      enum:
        - ENABLE
        - DISABLE
        - SELECT
        - JOIN
    NetworkState:
      type: string
      enum:
        - CONNECTED
        - OUT_OF_RANGE
        - DISABLED
        - TEMPORARY_DISABLED
    WifiChange:
      type: object
      properties:
        event:
          $ref: '#/components/schemas/WifiEvent'
        id:
          type: integer
          description: Saved network the event refers to. Only present when the event concerns a specific network.
        ssid_hex:
          type: string
          description: Hexstring of the network's native SSID, where known.
    WifiEvent:
      description: |
        WiFi event:
        - `CONNECTED`: Authentication completed successfully and data connection enabled.
        - `DISCONNECTED`: Disconnected from access point and data connection not available.
        - `SCAN_STARTED`: Network scan started.
        - `SCAN_COMPLETED`: New network scan results available.
        - `SCAN_FAILED`: Network scanning failed.
        - `NETWORK_NOT_FOUND`: No suitable network was found.
        - `WRONG_KEY`: Authentication failure due to an invalid pre-shared key.
        - `NETWORK_ADDED`: A new network profile was added.
        - `NETWORK_REMOVED`: A network profile was removed.
      type: string
      enum:
        - CONNECTED
        - DISCONNECTED
        - SCAN_STARTED
        - SCAN_COMPLETED
        - SCAN_FAILED
        - NETWORK_NOT_FOUND
        - WRONG_KEY
        - NETWORK_ADDED
        - NETWORK_REMOVED
