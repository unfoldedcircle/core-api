    add_wifi_network:
      summary: 🧪 Create a new WiFi network configuration.
      description: |
        Add a new network configuration for the given SSID.
        For an open network without password the `password` field must be omitted (do not send an empty password value).

        The optional `security` field selects the security type (open, WPA/WPA2-PSK, WPA3-SAE, WPA2/WPA3 transition mode).
        If omitted, a password creates the strongest profile the device's WiFi hardware supports: WPA2/WPA3 transition
        mode on hardware with WPA3 support (connects to WPA2-only, transition and WPA3-only networks), WPA/WPA2-PSK
        otherwise. Clients therefore do not need to determine the network's security type.
        `WPA3_SAE` requires WPA3 support of the device's WiFi hardware, otherwise the request is rejected.

        Set `hidden` to connect to a hidden network (non-broadcasting SSID).

        ⚠️ WPA3-Enterprise, WPA-EAP and WEP networks are not supported!
      tags:
        - name: wifi
      payload:
        $ref: '#/components/schemas/WifiAddNetworkMsg'
      x-response:
        summary: 🧪 WiFi network configuration.
        tags:
          - name: wifi
        payload:
          $ref: '#/components/schemas/WifiNetworkMsg'
